<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101827"><meta name="description" content="FJ — a small corner of the internet."><title>FJ</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="page"><a class="brand" id="fj" href="#" aria-label="FJ — change logo colour">FJ</a><nav class="links" aria-label="Main navigation"><a href="#access">Private access</a><a href="random.html">Random QR</a></nav>
<section class="access" id="access" aria-labelledby="access-title"><h1 id="access-title">Private access</h1><p>Request access or sign in if your account has been approved.</p>
<form id="request-form" class="form"><label>Email <input id="request-email" type="email" autocomplete="email" required></label><button type="submit">Request access</button><p>After approval, use “Reset password” to choose your password.</p></form>
<form id="sign-in-form" class="form"><label>Email <input id="sign-in-email" type="email" autocomplete="username" required></label><label>Password <input id="sign-in-password" type="password" autocomplete="current-password" required></label><div class="actions"><button type="submit">Sign in</button><button class="quiet" id="reset-password" type="button">Reset password</button></div></form>
<div id="signed-in" class="signed-in" hidden><span id="signed-in-label"></span><button class="quiet" id="sign-out" type="button">Sign out</button></div><p id="status" class="status" role="status" aria-live="polite"></p>
<section id="owner-panel" class="owner-panel" hidden><h2>Access requests</h2><div id="requests-list"></div></section></section></main><script type="module" src="app.js"></script></body></html>
