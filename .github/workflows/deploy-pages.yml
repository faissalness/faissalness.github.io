name: Deploy FJ website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble public allowlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for file in \
            index.html meet.html gods.html notes.html random.html \
            app.js private-page.js notes.js random.js qr-client.js destinations.js \
            firebase-config.js styles.css favicon.svg qr.png random-qr.png; do
            test -f "$file"
            cp -- "$file" dist/
          done
          if find dist -type f \( -iname '*.map' -o -iname '*worker*' -o -iname '*serviceaccount*' \) | grep -q .; then
            echo "Unexpected backend or source-map file in public artifact" >&2
            exit 1
          fi

      - name: Upload public artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
