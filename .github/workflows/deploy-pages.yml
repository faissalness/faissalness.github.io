name: Deploy FJ website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble public allowlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for file in \
            index.html meet.html gods.html notes.html random.html qr.html pip.html ground-zero.html \
            app.js private-page.js notes.js pip.js ground-zero.js note-crypto.mjs random.js qr-client.js qr-tech.js qr-url.js destinations.js \
            firebase-config.js styles.css favicon.svg qr.png random-qr.png; do
            test -f "$file"
            cp -- "$file" dist/
          done
          mkdir -p dist/ground-zero
          cp -- ground-zero.html dist/ground-zero/index.html
          sed -i '/<head>/a\  <base href="/">' dist/ground-zero/index.html
          mkdir -p dist/qr
          cp -- qr.html dist/qr/index.html
          sed -i '/<head>/a\  <base href="/">' dist/qr/index.html
          for route in meet gods notes; do
            mkdir -p "dist/$route"
            cp -- "$route.html" "dist/$route/index.html"
            sed -i '/<head>/a\  <base href="/">' "dist/$route/index.html"
          done
          mkdir -p dist/pip
          cp -- pip.html dist/pip/index.html
          sed -i '/<head>/a\  <base href="/">' dist/pip/index.html
          if find dist -type f \( -iname '*.map' -o -iname '*worker*' -o -iname '*serviceaccount*' \) | grep -q .; then
            echo "Unexpected backend or source-map file in public artifact" >&2
            exit 1
          fi

      - name: Upload public artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
